<div class="login-container">
  <form [formGroup]="forgotPasswordForm" class="login-card">
    <h2>Forgot Password</h2>

    <!-- Step 1: Request Recovery Code -->
    <ng-container *ngIf="step === 1">
      <p class="subtitle">Enter your email to receive a recovery code.</p>

      <div class="form-group">
        <label>Email:</label>
        <input type="email" formControlName="email" placeholder="Enter your email">
      </div>

      <button 
        type="button" 
        (click)="onSendCode()" 
        [disabled]="forgotPasswordForm.get('email')?.invalid || isLoading">
        {{ isLoading ? 'Sending...' : 'Send Recovery Code' }}
      </button>
    </ng-container>

    <!-- Step 2: Enter Code & Set New Password -->
    <ng-container *ngIf="step === 2">
      <p class="subtitle">Enter the 6-digit code sent to your email and choose a new password.</p>

      <div class="form-group">
        <label>Verification Code:</label>
        <input type="text" formControlName="code" placeholder="6-digit code" maxlength="6">
      </div>

      <div class="form-group">
        <label>New Password:</label>
        <input type="password" formControlName="newPassword" placeholder="Enter new password">
      </div>

      <div class="form-group">
        <label>Confirm New Password:</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm new password">
        <span class="error-text" *ngIf="forgotPasswordForm.hasError('passwordMismatch') && forgotPasswordForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </span>
      </div>

      <button 
        type="button" 
        (click)="onResetPassword()" 
        [disabled]="forgotPasswordForm.invalid || isLoading">
        {{ isLoading ? 'Updating...' : 'Update Password' }}
      </button>

      <button type="button" class="btn-secondary" (click)="step = 1" [disabled]="isLoading">
        Change Email
      </button>
    </ng-container>

    <div class="footer-links">
      <span>Remembered your password?</span>
      <a routerLink="/login">Back to Login</a>
    </div>
  </form>
</div>
